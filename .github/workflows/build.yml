name: build-and-release

# Собирает ipk из репозитория (build.sh) и публикует его как GitHub Release,
# откуда его тянет `kvas upgrade` (см. opt/bin/main/upgrade → release_url).
#
# Запуск:
#   • merge/push в master — выпускает следующий доступный номер автоматически;
#   • вручную (Actions → build-and-release → Run workflow), поле release = номер сборки;
#   • или пушем тега вида v27 (номер берётся из хвоста тега).
#
# Автоматический номер при master — max(VERSION, последний release + 1).
# Поэтому новая Release всегда новее установленного пакета и будет обнаружена
# командой `kvas upgrade`, даже если VERSION забыли поднять в PR.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Номер релиза (например 27)'
        required: true
        default: '27'
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

# Не допускаем одновременный расчёт одного номера двумя merge.
concurrency:
  group: kvas-release-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определяем номер релиза
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            num="${{ github.event.inputs.release }}"
          elif [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            # При merge в master создаём новый номер, который точно больше
            # опубликованного. VERSION остаётся предпочтительным минимумом.
            requested=$(tr -cd '0-9' < VERSION)
            case "$requested" in
              ''|*[!0-9]*) echo "VERSION must contain a positive integer" >&2; exit 1 ;;
            esac
            latest=$(curl -fsSL \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest" \
              2>/dev/null | jq -r '.tag_name // empty' | sed 's/.*-//' || true)
            case "$latest" in ''|*[!0-9]*) latest=0 ;; esac
            if [ "$requested" -gt "$latest" ]; then
              num="$requested"
            else
              num=$((latest + 1))
            fi
          else
            # тег v27 → 27 ; тег v1.1.9_beta-10-27 → 27
            num="${GITHUB_REF_NAME##*[!0-9]}"
          fi
          case "$num" in ''|*[!0-9]*) echo "Не удалось определить номер релиза" >&2; exit 1 ;; esac
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "tag=v1.1.9_beta-10-$num" >> "$GITHUB_OUTPUT"

      - name: Сборка ipk
        run: |
          chmod +x build.sh
          ./build.sh "${{ steps.rel.outputs.num }}"

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: KVAS ${{ steps.rel.outputs.tag }}
          files: kvas_1.1.9_beta-10-${{ steps.rel.outputs.num }}_all.ipk
          make_latest: true
