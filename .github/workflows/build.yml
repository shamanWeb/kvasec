name: build-and-release

# Собирает ipk из репозитория (build.sh) и публикует его как GitHub Release,
# откуда его тянет `kvas upgrade` (см. opt/bin/main/upgrade → release_url).
#
# Запуск:
#   • merge/push в master — увеличивает PATCH-версию и выпускает новый IPK;
#   • вручную (Actions → build-and-release → Run workflow), поле version;
#   • или пушем тега вида v1.3.0.
#
# VERSION задаёт стартовую/следующую базовую SemVer-версию. После первого релиза
# CI увеличивает только PATCH: 1.3.0 → 1.3.1 → 1.3.2.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия MAJOR.MINOR.PATCH (например 1.3.0)'
        required: true
        default: '1.3.0'
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

# Не допускаем одновременный расчёт одного номера двумя merge.
concurrency:
  group: kvas-release-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определяем версию релиза
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            # VERSION используется для первой новой SemVer-версии. После неё
            # каждый merge автоматически увеличивает только PATCH.
            baseline=$(tr -d '[:space:]' < VERSION)
            echo "$baseline" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "VERSION must contain MAJOR.MINOR.PATCH" >&2; exit 1;
            }
            latest=$(curl -fsSL \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/latest" \
              2>/dev/null | jq -r '.tag_name // empty' | sed 's/^v//' || true)
            echo "$latest" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || latest=''
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$baseline" "$latest" | sort -V | tail -1)" = "$latest" ]; then
              major=${latest%%.*}
              rest=${latest#*.}
              minor=${rest%%.*}
              patch=${rest##*.}
              version="${major}.${minor}.$((patch + 1))"
            else
              version="$baseline"
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Не удалось определить SemVer-версию" >&2; exit 1;
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Сборка ipk
        run: |
          chmod +x build.sh
          ./build.sh "${{ steps.rel.outputs.version }}"
          sha256sum "kvasec_${{ steps.rel.outputs.version }}.ipk" > "kvasec_${{ steps.rel.outputs.version }}.ipk.sha256"

      - name: Регрессионные тесты
        run: make test

      # shellcheck >= 0.10 нужен для -s busybox (Makefile); в ubuntu-latest — 0.9. Архив сверяется по sha256.
      - name: shellcheck
        run: |
          v=v0.11.0
          sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL --retry 3 -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${v}/shellcheck-${v}.linux.x86_64.tar.xz"
          echo "${sha}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          export PATH="/tmp/shellcheck-${v}:$PATH"
          shellcheck --version
          make lint

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: KVASEC ${{ steps.rel.outputs.tag }}
          files: |
            kvasec_${{ steps.rel.outputs.version }}.ipk
            kvasec_${{ steps.rel.outputs.version }}.ipk.sha256
          make_latest: true
